<!-- JavaScript Application Logic -->
    <script>
        // --- Core Application State ---
        let currentUser = null; // { name, email, phone, role: 'admin'|'contributor'|'user', coins }
        let currentCategory = 'All';
        let cart = [];
        
        // Mock Databases (In-Memory)
        let products = [
            { id: 1, title: 'Abstract Golden Wave', category: 'Vectors', price: 25, image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500', downloadLink: '#', desc: 'High-res vector wave background in dark and gold.', status: 'approved', contributor: 'Hein Yazar Soe' },
            { id: 2, title: 'Dark SaaS Dashboard UI', category: 'UI/UX', price: 40, image: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=500', downloadLink: '#', desc: 'Complete Figma UI kit for modern SaaS applications.', status: 'approved', contributor: 'Hein Yazar Soe' }
        ];
        
        let pendingProducts = [];
        let contributors = [
            { name: 'Hein Yazar Soe', email: 'veryacomputerclass@gmail.com', phone: '09941117896', status: 'Approved', earnings: 0 }
        ];
        let pendingContributors = [];
        let topupRequests = [];
        let withdrawalRequests = [];
        let salesHistory = [];
        let userDownloads = [];

        // --- Navigation & Tabs ---
        function switchTab(tabId) {
            // Admin tab ကို Admin မှလွဲ၍ အခြားသူများ ဝင်မရအောင် ကာကွယ်ခြင်း
            if(tabId === 'admin') {
                if(!currentUser || currentUser.email !== 'veryacomputerclass@gmail.com') {
                    alert('Access Denied! Admin only area (veryacomputerclass@gmail.com).');
                    return;
                }
            }
// --- Admin Dashboard Action & Table Rendering System ---
        function updateAdminDashboard() {
            // Admin ဟုတ်မဟုတ် ထပ်မံလုံခြုံရေး စစ်ဆေးခြင်း
            if (!currentUser || currentUser.email !== 'veryacomputerclass@gmail.com') {
                return;
            }

            // Stat Counter များကို Update လုပ်ခြင်း
            document.getElementById('adminStatContributors').innerText = contributors.length;
            document.getElementById('adminStatProducts').innerText = products.filter(p => p.status === 'approved').length;
            document.getElementById('adminStatPending').innerText = pendingProducts.length + pendingContributors.length + topupRequests.length;
            document.getElementById('adminBadgeCount').innerText = pendingProducts.length + pendingContributors.length + topupRequests.length + withdrawalRequests.length;

            // 1. Contributor Applications Table Rendering
            const conTable = document.getElementById('adminContributorTable');
            if (pendingContributors.length === 0) {
                conTable.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-slate-500">No contributor requests.</td></tr>`;
            } else {
                conTable.innerHTML = pendingContributors.map((c, index) => `
                    <tr class="border-b border-slate-800">
                        <td class="p-3 text-white font-medium">${c.name}</td>
                        <td class="p-3 text-slate-300">${c.email}</td>
                        <td class="p-3 text-slate-300">${c.phone}</td>
                        <td class="p-3 text-amber-400 font-bold">${c.status}</td>
                        <td class="p-3 space-x-2">
                            <button onclick="approveContributor(${index})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-bold">Approve</button>
                            <button onclick="rejectContributor(${index})" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded text-xs font-bold">Reject</button>
                        </td>
                    </tr>
                `).join('');
            }

            // 2. Pending Products Table Rendering
            const prodTable = document.getElementById('adminProductTable');
            if (pendingProducts.length === 0) {
                prodTable.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-slate-500">No pending products.</td></tr>`;
            } else {
                prodTable.innerHTML = pendingProducts.map((p, index) => `
                    <tr class="border-b border-slate-800">
                        <td class="p-3"><img src="${p.image}" class="w-12 h-12 object-cover rounded-lg"></td>
                        <td class="p-3">
                            <strong class="text-white block">${p.title}</strong>
                            <span class="text-xs text-slate-400">By ${p.contributor} | Category: ${p.category}</span>
                        </td>
                        <td class="p-3 text-amber-400 font-bold">${p.price} Coins</td>
                        <td class="p-3 space-x-2">
                            <button onclick="approveProduct(${index})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-bold">Approve</button>
                            <button onclick="rejectProduct(${index})" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded text-xs font-bold">Reject</button>
                        </td>
                    </tr>
                `).join('');
            }

            // 3. Pending Top-Up Table Rendering
            const topupTable = document.getElementById('adminTopupTable');
            if (topupRequests.length === 0) {
                topupTable.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-slate-500">No top-up requests.</td></tr>`;
            } else {
                topupTable.innerHTML = topupRequests.map((t, index) => `
                    <tr class="border-b border-slate-800">
                        <td class="p-3 text-white">${t.user}</td>
                        <td class="p-3 text-slate-300">Phone: ${t.phone}</td>
                        <td class="p-3 text-amber-400 font-bold">${t.coins} Coins</td>
                        <td class="p-3 text-emerald-400 font-mono font-bold">${t.code}</td>
                        <td class="p-3 space-x-2">
                            <button onclick="approveTopup(${index})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-bold">Approve</button>
                            <button onclick="rejectTopup(${index})" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded text-xs font-bold">Reject</button>
                        </td>
                    </tr>
                `).join('');
            }

            // 4. Withdrawal Requests Table Rendering
            const withdrawTable = document.getElementById('adminWithdrawTable');
            if (withdrawalRequests.length === 0) {
                withdrawTable.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-slate-500">No withdrawal requests.</td></tr>`;
            } else {
                withdrawTable.innerHTML = withdrawalRequests.map((w, index) => `
                    <tr class="border-b border-slate-800">
                        <td class="p-3 text-white font-medium">${w.contributor}</td>
                        <td class="p-3 text-slate-300">${w.phone}</td>
                        <td class="p-3 text-amber-400 font-bold">${w.coins} Coins</td>
                        <td class="p-3">
                            <button onclick="approveWithdrawal(${index})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-bold">Mark as Paid</button>
                        </td>
                    </tr>
                `).join('');
            }
        }

        // --- Admin Action Logic Functions ---
        function approveContributor(index) {
            const approved = pendingContributors.splice(index, 1)[0];
            approved.status = 'Approved';
            contributors.push(approved);
            alert(`Contributor ${approved.name} has been approved!`);
            updateAdminDashboard();
        }

        function rejectContributor(index) {
            pendingContributors.splice(index, 1);
            alert('Contributor application rejected.');
            updateAdminDashboard();
        }

        function approveProduct(index) {
            const prod = pendingProducts.splice(index, 1)[0];
            prod.status = 'approved';
            products.push(prod);
            alert(`Product "${prod.title}" approved and published to marketplace!`);
            updateAdminDashboard();
        }

        function rejectProduct(index) {
            pendingProducts.splice(index, 1);
            alert('Product upload rejected.');
            updateAdminDashboard();
        }

        function approveTopup(index) {
            const req = topupRequests.splice(index, 1)[0];
            // အကယ်၍ လက်ရှိ Logged in ဖြစ်နေသူမှာ ထိုသူဖြစ်ပါက Coins ထည့်ပေးမည် (သို့မဟုတ် Mock အနေဖြင့်)
            alert(`Approved ${req.coins} coins top-up for ${req.user}!`);
            updateAdminDashboard();
        }

        function rejectTopup(index) {
            topupRequests.splice(index, 1);
            alert('Top-up request rejected.');
            updateAdminDashboard();
        }

        function approveWithdrawal(index) {
            withdrawalRequests.splice(index, 1);
            alert('Withdrawal marked as paid successfully!');
            updateAdminDashboard();
        }
            document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            if(tabId === 'home') renderProducts();
            if(tabId === 'downloads') renderDownloads();
            if(tabId === 'contributor') updateContributorDashboard();
            if(tabId === 'admin') updateAdminDashboard();
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const icon = document.getElementById('themeIcon');
            icon.classList.toggle('fa-sun');
            icon.classList.toggle('fa-moon');
        }

        // --- Authentication & Admin Enforcement ---
        function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
        
        function switchAuthMode(mode) {
            if(mode === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('tabLoginBtn').className = "flex-1 py-1.5 text-xs font-bold bg-amber-500 text-slate-950 rounded-lg";
                document.getElementById('tabRegBtn').className = "flex-1 py-1.5 text-xs font-bold bg-slate-800 text-slate-300 rounded-lg";
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('tabRegBtn').className = "flex-1 py-1.5 text-xs font-bold bg-amber-500 text-slate-950 rounded-lg";
                document.getElementById('tabLoginBtn').className = "flex-1 py-1.5 text-xs font-bold bg-slate-800 text-slate-300 rounded-lg";
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            // Admin အကောင့် သီးသန့်စစ်ဆေးခြင်း (veryacomputerclass@gmail.com သာလျှင် Admin ဖြစ်ရမည်)
            if(email === 'veryacomputerclass@gmail.com') {
                // လိုအပ်ပါက Admin password ကို ဤနေရာတွင် စစ်ဆေးနိုင်သည် (ဥပမာ- admin123)
                currentUser = { 
                    name: 'Hein Yazar Soe (Admin)', 
                    email: email, 
                    role: 'admin', 
                    coins: 99999, 
                    phone: '09941117896' 
                };
                document.getElementById('navAdminLink').classList.remove('hidden');
                alert('Admin Login Successful!');
            } else {
                // သာမန် Contributor/User အကောင့်များအတွက်
                currentUser = { 
                    name: 'Valued Contributor', 
                    email: email, 
                    role: 'contributor', 
                    coins: 150, 
                    phone: '09941117896' 
                };
                document.getElementById('navAdminLink').classList.add('hidden');
                alert('Successfully Logged In!');
            }
            
            updateUserUI();
            closeAuthModal();
        }

        function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('regFullName').value;
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value;
            
            // Register လုပ်ရာတွင် Admin email ဖြင့် မှတ်ပုံတင်ခွင့်မပြုရန် ကာကွယ်ခြင်း
            if(email === 'veryacomputerclass@gmail.com') {
                alert('This email is reserved for System Admin.');
                return;
            }

            pendingContributors.push({ name, email, phone, status: 'Pending' });
            alert('Registration submitted! Awaiting Admin Approval.');
            closeAuthModal();
        }

        function updateUserUI() {
            if(currentUser) {
                document.getElementById('userCoinBalance').innerText = currentUser.coins;
                document.getElementById('authNavBtn').innerHTML = `<i class="fa-solid fa-user-check mr-1"></i> ${currentUser.name}`;
            }
        }

        // --- Marketplace & Filtering ---
        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "category-btn bg-slate-900 text-slate-300 hover:text-white px-4 py-2 rounded-xl text-xs border border-slate-800 transition";
                if(btn.innerText.includes(cat) || (cat === 'All' && btn.innerText.includes('All'))) {
                    btn.className = "category-btn bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition";
                }
            });
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const sort = document.getElementById('sortSelect').value;
            
            let filtered = products.filter(p => {
                const matchesCat = currentCategory === 'All' || p.category === currentCategory;
                const matchesSearch = p.title.toLowerCase().includes(search);
                return matchesCat && matchesSearch && p.status === 'approved';
            });

            if(sort === 'low-high') filtered.sort((a,b) => a.price - b.price);
            if(sort === 'high-low') filtered.sort((a,b) => b.price - a.price);

            grid.innerHTML = filtered.map(p => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between group">
                    <div>
                        <div class="relative h-40 overflow-hidden bg-black">
                            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <span class="absolute top-2 left-2 bg-slate-950/80 text-amber-400 text-[10px] px-2 py-0.5 rounded-md font-bold">${p.category}</span>
                        </div>
                        <div class="p-4 space-y-1">
                            <h3 class="font-bold text-sm text-white truncate">${p.title}</h3>
                            <p class="text-xs text-slate-400">By ${p.contributor}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex justify-between items-center">
                        <span class="text-amber-400 font-bold text-sm">${p.price} Coins</span>
                        <button onclick="openPreview(${p.id})" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-700">View</button>
                    </div>
                </div>
            `).join('') || '<p class="text-slate-500 col-span-full text-center py-8">No assets found.</p>';
        }

        // --- Modals (Preview, Cart, Top-Up) ---
        function openPreview(id) {
            const p = products.find(item => item.id === id);
            document.getElementById('modalTitle').innerText = p.title;
            document.getElementById('modalImage').src = p.image;
            document.getElementById('modalDesc').innerText = p.desc;
            document.getElementById('modalPrice').innerText = `${p.price} Coins`;
            document.getElementById('modalActionContainer').innerHTML = `
                <button onclick="addToCart(${p.id}); closePreviewModal();" class="gold-btn text-slate-950 font-bold px-4 py-2 rounded-xl text-xs">Add to Cart</button>
            `;
            document.getElementById('previewModal').classList.remove('hidden');
        }
        function closePreviewModal() { document.getElementById('previewModal').classList.add('hidden'); }

        function openCartModal() { document.getElementById('cartModal').classList.remove('hidden'); renderCart(); }
        function closeCartModal() { document.getElementById('cartModal').classList.add('hidden'); }

        function addToCart(id) {
            const p = products.find(item => item.id === id);
            if(!cart.some(item => item.id === id)) {
                cart.push(p);
                document.getElementById('cartCountBadge').innerText = cart.length;
                alert('Added to cart!');
            } else {
                alert('Item already in cart.');
            }
        }

        function renderCart() {
            const list = document.getElementById('cartList');
            let total = 0;
            list.innerHTML = cart.map(item => {
                total += item.price;
                return `<div class="flex justify-between items-center bg-slate-950 p-2 rounded-lg"><span>${item.title}</span><span class="text-amber-400">${item.price} Coins</span></div>`;
            }).join('') || '<p class="text-slate-500 text-center">Cart is empty.</p>';
            document.getElementById('cartTotal').innerText = `${total} Coins`;
        }

        function checkoutCart() {
            if(!currentUser) { alert('Please login first.'); return; }
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            if(currentUser.coins < total) { alert('Insufficient coins! Please top up.'); return; }
            
            currentUser.coins -= total;
            updateUserUI();
            userDownloads.push(...cart);
            cart = [];
            document.getElementById('cartCountBadge').innerText = '0';
            closeCartModal();
            alert('Checkout successful! Assets added to My Downloads.');
        }

        function renderDownloads() {
            const grid = document.getElementById('downloadGrid');
            grid.innerHTML = userDownloads.map(p => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                    <img src="${p.image}" class="w-full h-32 object-cover rounded-xl">
                    <h3 class="font-bold text-sm">${p.title}</h3>
                    <a href="${p.downloadLink}" target="_blank" class="block text-center gold-btn text-slate-950 font-bold py-2 rounded-xl text-xs">Download Secure File</a>
                </div>
            `).join('') || '<p class="text-slate-500 col-span-full text-center py-8">No downloaded assets yet.</p>';
        }

        function openTopUpModal() { document.getElementById('topUpModal').classList.remove('hidden'); }
        function closeTopUpModal() { document.getElementById('topUpModal').classList.add('hidden'); }
        function submitTopUp() {
            const coins = document.getElementById('topupCoins').value;
            const code = document.getElementById('topupCode').value;
            const phone = document.getElementById('topupPhone').value;
            
            topupRequests.push({ user: currentUser ? currentUser.email : 'Guest', coins, code, phone });
            closeTopUpModal();
            alert('Top-up request submitted for admin review!');
        }

        // --- Contributor & Admin Panels ---
        function updateContributorDashboard() {
            if(!currentUser) {
                document.getElementById('contributorGuestView').classList.remove('hidden');
                document.getElementById('contributorDashboard').classList.add('hidden');
            } else {
                document.getElementById('contributorGuestView').classList.add('hidden');
                document.getElementById('contributorDashboard').classList.remove('hidden');
                document.getElementById('conWelcomeName').innerText = `Welcome, ${currentUser.name}`;
            }
        }

        function handleContributorUpload(e) {
            e.preventDefault();
            const newProd = {
                id: products.length + 1,
                title: document.getElementById('conTitle').value,
                category: document.getElementById('conCategory').value,
                price: Number(document.getElementById('conCoins').value),
                image: document.getElementById('conImage').value,
                downloadLink: document.getElementById('conDownloadLink').value,
                desc: document.getElementById('conDesc').value,
                status: 'pending',
                contributor: currentUser ? currentUser.name : 'Unknown'
            };
            pendingProducts.push(newProd);
            alert('Product submitted for admin review!');
            document.getElementById('contributorForm').reset();
        }

        function requestWithdrawal() {
            const amt = document.getElementById('withdrawCoins').value;
            withdrawalRequests.push({ contributor: currentUser ? currentUser.name : 'Unknown', phone: currentUser ? currentUser.phone : 'N/A', coins: amt });
            alert('Withdrawal request sent to admin.');
        }

        function updateAdminDashboard() {
            // ထပ်မံလုံခြုံရေး စစ်ဆေးချက်
            if (!currentUser || currentUser.email !== 'veryacomputerclass@gmail.com') {
                return;
            }

            document.getElementById('adminStatContributors').innerText = contributors.length;
            document.getElementById('adminStatProducts').innerText = products.filter(p => p.status === 'approved').length;
            document.getElementById('adminStatPending').innerText = pendingProducts.length + pendingContributors.length + topupRequests.length;
            document.getElementById('adminBadgeCount').innerText = pendingProducts.length + pendingContributors.length + topupRequests.length + withdrawalRequests.length;
        }

        // Initialize default view
        renderProducts();
    </script>
